<!DOCTYPE html>
<html>
<head>
    <title>Reads the XML data using JavaScript</title>

    <style>
        table {
            border-collapse: collapse;
            width: 100%;
            /* Ensure it transitions nicely if needed, but defaults to visible when populated */
        }

        th,
        td {
            text-align: left;
            padding: 8px;
        }

        tr:nth-child(even) {
            background-color: #7ce2af;
        }

        th {
            background-color: #7c0f65;
            color: white;
        }

        .button {
            position: relative;
            text-align: center;
            padding: 20px;
            border: 4px solid rgb(55, 12, 211);
            background: rgba(20, 192, 4, 0.5);
            color: rgb(230, 36, 78);
            outline: none;
            border-radius: 30px;
            font-size: 30px;
            width: 500px;
            cursor: pointer;
        }

        .button:hover {
            color: black;
            background: white;
        }
    </style>

    <script>
        // Track whether the XML data has already been fetched
        let isDataLoaded = false;

        function toggleEmployeeData() {
            let btn = document.getElementById("toggleBtn");
            let table = document.getElementById("id");

            // Check if the table is hidden or hasn't been loaded yet
            if (table.style.display === "none" || !isDataLoaded) {
                
                // If data isn't loaded, fetch it
                if (!isDataLoaded) {
                    let xmlhttp = new XMLHttpRequest();
                    xmlhttp.onreadystatechange = function () {
                        // Request finished and response is ready and Status is "OK"
                        if (this.readyState == 4 && this.status == 200) {
                            empDetails(this);
                            isDataLoaded = true;
                            table.style.display = "table"; // Show table
                        }
                    };

                    // employee.xml is the external xml file
                    xmlhttp.open("GET", "employee.xml", true);
                    xmlhttp.send();
                } else {
                    // Data is already loaded, just reveal the table
                    table.style.display = "table";
                }
                
                // Update button text
                btn.innerText = "Close Employee Data";
                
            } else {
                // Table is currently visible, so hide it
                table.style.display = "none";
                
                // Revert button text
                btn.innerText = "Get Employee Data";
            }
        }

        function empDetails(xml) {
            let i;
            let xmlDoc = xml.responseXML;
            let table =
                `<tr><th>Firstname</th><th>Lastname</th>
                    <th>Title</th><th>Division</th>
                    <th>Building</th><th>Room</th>
                </tr>`;
            let x = xmlDoc.getElementsByTagName("employee");

            // Start to fetch the data by using TagName 
            for (i = 0; i < x.length; i++) {
                table += "<tr><td>" +
                    x[i].getElementsByTagName("firstname")[0].childNodes[0].nodeValue + "</td><td>" +
                    x[i].getElementsByTagName("lastname")[0].childNodes[0].nodeValue + "</td><td>" +
                    x[i].getElementsByTagName("title")[0].childNodes[0].nodeValue + "</td><td>" +
                    x[i].getElementsByTagName("division")[0].childNodes[0].nodeValue + "</td><td>" +
                    x[i].getElementsByTagName("building")[0].childNodes[0].nodeValue + "</td><td>" +
                    x[i].getElementsByTagName("room")[0].childNodes[0].nodeValue + "</td></tr>";
            }

            // Print the xml data in table form
            document.getElementById("id").innerHTML = table;
        }
    </script>
</head>

<body>
    <center>
        <button type="button" id="toggleBtn" class="button" onclick="toggleEmployeeData()">
            Get Employee Data
        </button>
    </center>

    <br><br>
    <table id="id" style="display: none;"></table>
</body>
</html>
